name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: "3.14"

      - run: uv sync --locked --all-groups

      - name: ruff format
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: mypy
        run: uv run mypy --strict src/

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # A prerelease breaking is information, not a reason to block main. Every
    # supported version is required.
    continue-on-error: ${{ matrix.prerelease || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
          - os: ubuntu-latest
            python: "3.15"
            prerelease: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - run: uv sync --locked --all-groups

      - name: pytest
        run: uv run pytest --cov=pydocvi --cov-report=xml --cov-fail-under=85

      - name: upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: "3.14"

      - name: build
        run: uv build

      - name: the wheel installs and its entry point runs
        run: |
          uv tool install --from "$(ls dist/*.whl)" python-docs-vi-translator
          pydocvi version

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
