name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - run: uv sync --locked --all-groups

      - name: ruff format
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: mypy
        run: uv run mypy --strict src/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.14"]
        include:
          - os: macos-latest
            python: "3.14"
          - os: ubuntu-latest
            python: "3.15-dev"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - run: uv sync --locked --all-groups

      - name: pytest
        run: uv run pytest --cov=pydocvi --cov-report=xml --cov-fail-under=85

      - name: upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: build
        run: uv build

      - name: the wheel installs and the entry point runs
        run: |
          uv tool install --from dist/*.whl python-docs-vi-translator
          pydocvi version

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
