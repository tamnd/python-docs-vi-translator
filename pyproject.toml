[project]
name = "python-docs-vi-translator"
version = "0.1.5"
description = "Translates the CPython documentation into Vietnamese gettext catalogs, with a deterministic audit over every string it writes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "tamnd", email = "1218621+tamnd@users.noreply.github.com" }]
keywords = ["gettext", "po", "sphinx", "translation", "vietnamese", "python-docs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Vietnamese",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Localization",
    "Typing :: Typed",
]
dependencies = [
    "polib>=1.2",
    "httpx>=0.28",
    "typer>=0.15",
    "rich>=13",
    "pydantic>=2.10",
    "ruamel.yaml>=0.18",
    "platformdirs>=4",
]

[project.urls]
Homepage = "https://github.com/tamnd/python-docs-vi-translator"
Source = "https://github.com/tamnd/python-docs-vi-translator"
Issues = "https://github.com/tamnd/python-docs-vi-translator/issues"

[project.scripts]
pydocvi = "pydocvi.cli:main"

[dependency-groups]
dev = [
    # Not used by the package, and here because it is what Sphinx reads these
    # files with. polib is more forgiving than Babel, so a test that reads our
    # own output back with our own reader agrees with itself and proves nothing:
    # it passed the whole time the corpus was shipping a PO-Revision-Date that
    # made Sphinx skip every catalog. The consumer's parser is the only one whose
    # opinion decides whether the site has any Vietnamese on it.
    "babel>=2.16",
    "pytest>=8.3",
    "pytest-cov>=6",
    "pytest-asyncio>=0.25",
    "hypothesis>=6.120",
    "mypy>=1.14",
    "ruff>=0.9",
    "pre-commit>=4",
]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pydocvi"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",    # pycodestyle, pyflakes
    "I",              # import sorting
    "N",              # naming
    "UP",             # pyupgrade
    "B",              # bugbear
    "A",              # builtin shadowing
    "C4",             # comprehensions
    "SIM",            # simplify
    "PTH",            # pathlib over os.path
    "RUF",
]
ignore = [
    "E501",           # line length is the formatter's job, not the linter's
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["A002"]

[tool.ruff.lint.isort]
known-first-party = ["pydocvi"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
warn_unreachable = true
enable_error_code = ["redundant-expr", "possibly-undefined", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["polib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-q --strict-markers --strict-config"
markers = [
    "corpus: needs a local checkout of tamnd/python-docs-vi, skipped when absent",
    "fleet: needs a live model endpoint, never run in CI",
]

[tool.coverage.run]
source = ["pydocvi"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
